<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Library Management System</title>
<style>
:root{--bg:#f6f7fb;--fg:#1c2030;--card:#fff;--muted:#6b7285;--border:#dfe2ec;--btn:#3b4adb;--ok:#2fb36d;--bad:#e5484d;--chip:#eef0ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--fg:#e7e9f2;--card:#1b1e2a;--muted:#9aa1b5;--border:#2b2f40;--btn:#5b6cf0;--chip:#262a40}}
:root[data-theme="dark"]{--bg:#12141c;--fg:#e7e9f2;--card:#1b1e2a;--muted:#9aa1b5;--border:#2b2f40;--btn:#5b6cf0;--chip:#262a40}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:4px 0 2px}
h2{font-size:1rem;margin:0 0 8px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input{padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--fg);font-size:.92rem;flex:1;min-width:120px}
button{background:var(--btn);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:.88rem;cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--border)}
button.del{background:transparent;color:var(--bad);border:1px solid var(--bad)}
#msg{font-size:.9rem;margin:0 0 12px;min-height:1.3em}
.ll{display:flex;align-items:center;gap:6px;overflow-x:auto;padding-bottom:4px;font-size:.85rem}
.node{border:2px solid var(--btn);border-radius:8px;padding:4px 10px;white-space:nowrap}
.arrow{color:var(--muted)}
.book{display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.badge{font-size:.75rem;padding:2px 8px;border-radius:99px;color:#fff;background:var(--ok);height:fit-content}
.badge.out{background:var(--bad)}
.meta{color:var(--muted);font-size:.85rem}
.queue{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.82rem}
.chip{background:var(--chip);border-radius:99px;padding:2px 10px}
.empty{color:var(--muted);text-align:center;padding:18px}
</style>
</head>
<body>
<main>
<h1>Library Management System</h1>
<p class="sub">Books are stored in a <b>linked list</b>. Each book has a <b>queue</b> of students waiting for it (first come, first served).</p>

<div class="card">
  <h2>Add a book</h2>
  <div class="row">
    <input id="bid" type="number" placeholder="Book ID" min="1">
    <input id="btitle" placeholder="Title">
    <input id="bauthor" placeholder="Author">
    <button id="add">Add Book</button>
  </div>
</div>

<p id="msg"></p>

<div class="card">
  <h2>Linked list of books</h2>
  <div class="ll" id="ll"></div>
</div>

<div id="books"></div>

<script>
/* ---------- Queue (linked nodes): waiting list for one book ---------- */
class QNode { constructor(v){ this.v = v; this.next = null; } }
class Queue {
  constructor(){ this.front = null; this.rear = null; }
  isEmpty(){ return this.front === null; }
  enqueue(v){
    const n = new QNode(v);
    if (this.rear === null) this.front = this.rear = n;
    else { this.rear.next = n; this.rear = n; }
  }
  dequeue(){
    if (this.isEmpty()) return null;
    const v = this.front.v;
    this.front = this.front.next;
    if (this.front === null) this.rear = null;
    return v;
  }
  toArray(){ const a = []; for (let t = this.front; t; t = t.next) a.push(t.v); return a; }
}

/* ---------- Linked list: each node is a book ---------- */
class Book {
  constructor(id, title, author){
    this.id = id; this.title = title; this.author = author;
    this.issuedTo = null;        // null means available
    this.queue = new Queue();    // waiting students
    this.next = null;
  }
}
class Library {
  constructor(){ this.head = null; }
  find(id){ for (let t = this.head; t; t = t.next) if (t.id === id) return t; return null; }
  add(book){                       // insert at the end
    if (!this.head) this.head = book;
    else { let t = this.head; while (t.next) t = t.next; t.next = book; }
  }
  remove(id){
    let t = this.head, prev = null;
    while (t && t.id !== id){ prev = t; t = t.next; }
    if (!t) return false;
    if (prev) prev.next = t.next; else this.head = t.next;
    return true;
  }
  toArray(){ const a = []; for (let t = this.head; t; t = t.next) a.push(t); return a; }
}

const lib = new Library();
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const say = (text, ok = true) => { $('msg').textContent = text; $('msg').style.color = ok ? 'var(--ok)' : 'var(--bad)'; };

/* ---------- Operations ---------- */
function addBook(){
  const id = parseInt($('bid').value, 10), title = $('btitle').value.trim(), author = $('bauthor').value.trim();
  if (!id || !title || !author) return say('Please fill in ID, title and author.', false);
  if (lib.find(id)) return say('A book with this ID already exists.', false);
  lib.add(new Book(id, title, author));
  $('bid').value = $('btitle').value = $('bauthor').value = '';
  say(`Book "${title}" added.`);
  render();
}
function issueBook(id, student){
  const b = lib.find(id);
  if (!student) return say('Enter the student name first.', false);
  if (!b.issuedTo){ b.issuedTo = student; say(`"${b.title}" issued to ${student}.`); }
  else { b.queue.enqueue(student); say(`"${b.title}" is already issued to ${b.issuedTo}. ${student} added to the waiting queue.`, false); }
  render();
}
function returnBook(id){
  const b = lib.find(id), who = b.issuedTo;
  if (b.queue.isEmpty()){ b.issuedTo = null; say(`${who} returned "${b.title}". It is now available.`); }
  else { b.issuedTo = b.queue.dequeue(); say(`${who} returned "${b.title}". It is now issued to ${b.issuedTo} (next in queue).`); }
  render();
}
function deleteBook(id){ lib.remove(id); say('Book deleted.'); render(); }

/* ---------- Rendering ---------- */
function render(){
  const books = lib.toArray();
  $('ll').innerHTML = '<span class="arrow">HEAD →</span>' +
    (books.map(b => `<span class="node">${b.id}</span><span class="arrow">→</span>`).join('')) +
    '<span class="arrow">NULL</span>';
  $('books').innerHTML = books.length ? books.map(b => {
    const q = b.queue.toArray();
    return `<div class="card book">
      <div class="top">
        <div><b>${esc(b.title)}</b><div class="meta">by ${esc(b.author)} | ID ${b.id}</div></div>
        <span class="badge ${b.issuedTo ? 'out' : ''}">${b.issuedTo ? 'Issued to ' + esc(b.issuedTo) : 'Available'}</span>
      </div>
      <div class="queue"><span class="meta">Waiting queue (front to rear):</span>
        ${q.length ? q.map((s, i) => `<span class="chip">${i + 1}. ${esc(s)}</span>`).join('') : '<span class="meta">empty</span>'}
      </div>
      <div class="row">
        <input id="s-${b.id}" placeholder="Student name">
        <button data-act="issue" data-id="${b.id}">Issue</button>
        <button class="alt" data-act="return" data-id="${b.id}" ${b.issuedTo ? '' : 'disabled'}>Return</button>
        <button class="del" data-act="del" data-id="${b.id}">Delete</button>
      </div>
    </div>`;
  }).join('') : '<div class="card empty">No books yet. Add your first book above.</div>';
}

$('add').onclick = addBook;
$('books').onclick = e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const id = +btn.dataset.id;
  if (btn.dataset.act === 'issue'){
    const input = $('s-' + id), name = input.value.trim();
    issueBook(id, name);
  } else if (btn.dataset.act === 'return') returnBook(id);
  else deleteBook(id);
};
render();
</script>
</main>
</body>
</html>
